<style>
:root{--bg:#f6f1ea;--card:#fff;--ink:#2b2118;--mut:#7a6a5b;--line:#e6dccf;--pri:#6f4e37;--pri2:#8b6a50;--ok:#2e7d4f;--bad:#c0392b;--warn:#b7791f}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;flex:1;line-height:1.2}header h1 small{display:block;font-size:12px;font-weight:400;opacity:.85}
.logo{height:72px;width:auto;border-radius:12px;background:#f8f0e3;border:2px solid #e9dfd2}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px;background:#efe6da;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;color:var(--ink)}
nav button.on{background:var(--pri);color:#fff}
main{padding:16px;max-width:1280px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select,button.b{font:inherit}
.in,select,input[type=date],input[type=number],input[type=text]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fffdf9;min-width:0}
td .in{width:100%;min-width:70px}
button.b{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.b:hover{background:var(--pri2)}button.b.g{background:#e9dfd2;color:var(--ink)}button.b.r{background:var(--bad)}
button.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mut);background:#faf6f0;position:sticky;top:0}td.n,th.n{text-align:right}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;color:#fff;background:var(--ok)}.tag.bad{background:var(--bad)}.tag.warn{background:var(--warn)}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
canvas{max-height:300px}.mut{color:var(--mut)}.pos{color:var(--ok)}.neg{color:var(--bad)}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px}
#login form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
#login img{width:200px;max-width:70%;margin:0 auto}#login h2{margin:0}#login label{text-align:left}#login input{width:100%}
#lerr{color:var(--bad);min-height:18px;margin:0;font-size:13px}
#toast{position:fixed;bottom:16px;right:16px;background:#2b2118;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
</style>

function load(){try{const s=localStorage.getItem(K);if(s)return JSON.parse(s)}catch(e){}return JSON.parse(JSON.stringify(SEED))}
function localSave(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Gagal menyimpan ke browser!')}}
function save(){localSave();if(CLOUD)push()}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp '+Math.round(Math.abs(n)).toLocaleString('id-ID');
const nf=n=>(+n).toLocaleString('id-ID',{maximumFractionDigits:1});
const bId=id=>S.bahan.find(b=>b.id===id),mId=id=>S.menu.find(m=>m.id===id);

/* ---------- Perhitungan ---------- */
const hppB=b=>(b.harga/(b.isi||1))/(1-Math.min(b.susut||0,99)/100);
const hppM=id=>S.resep.filter(r=>r.menu===id).reduce((a,r)=>{const b=bId(r.bahan);return a+(b?r.jumlah*hppB(b):0)},0);
const saran=(h,m)=>Math.ceil(h/(1-Math.min(m,95)/100)/500)*500;
function stokAll(){const st={};S.bahan.forEach(b=>st[b.id]={masuk:0,pakai:0});
  S.pembelian.filter(p=>p.tgl>=S.mulai).forEach(p=>{const b=bId(p.bahan);if(b)st[b.id].masuk+=p.kemasan*b.isi});
  S.penjualan.filter(p=>p.tgl>=S.mulai).forEach(p=>S.resep.filter(r=>r.menu===p.menu).forEach(r=>{const b=bId(r.bahan);if(b)st[b.id].pakai+=r.jumlah*p.qty/(1-(b.susut||0)/100)}));
  return st}
const totBiaya=()=>S.biaya.reduce((a,b)=>a+(+b.jumlah||0),0);

/* ---------- Util UI ---------- */
function upd(list,id,f,el){const o=S[list].find(x=>x.id===id);if(!o)return;o[f]=el.type==='number'?(parseFloat(el.value)||0):el.value;save();render()}
const inp=(list,id,f,v,type='text',ex='')=>`<input class="in" type="${type}" value="${esc(v)}" ${ex} onchange="upd('${list}','${id}','${f}',this)">`;
function del(list,id,msg){if(confirm(msg||'Hapus baris ini?')){S[list]=S[list].filter(x=>x.id!==id);if(list==='menu')S.resep=S.resep.filter(r=>r.menu!==id);if(list==='bahan')S.resep=S.resep.filter(r=>r.bahan!==id);save();render()}}

function go(t){cur=t;render()}

function render(){
  document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===cur?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  const f={dash:vDash,bahan:vBahan,menu:vMenu,jual:vJual,beli:vBeli,biaya:vBiaya,data:vData}[cur];
  const y=window.scrollY;document.getElementById('app').innerHTML=f();window.scrollTo(0,y);
  if(cur==='dash')drawCharts();
}

/* ---------- Dashboard ---------- */
function vDash(){
  const ys=new Set([now.getFullYear(),fy]);S.penjualan.forEach(p=>ys.add(+p.tgl.slice(0,4)));
  const ym=`${fy}-${String(fm).padStart(2,'0')}`;
  const sales=S.penjualan.filter(p=>p.tgl.startsWith(ym));
  const omzet=sales.reduce((a,p)=>a+p.qty*p.harga,0),hpp=sales.reduce((a,p)=>a+p.qty*p.hpp,0),porsi=sales.reduce((a,p)=>a+p.qty,0);
  const lk=omzet-hpp,bt=totBiaya(),ln=lk-bt,avg=porsi?lk/porsi:0;
  const per={};sales.forEach(p=>{per[p.menu]=per[p.menu]||{q:0,o:0,l:0};per[p.menu].q+=p.qty;per[p.menu].o+=p.qty*p.harga;per[p.menu].l+=p.qty*(p.harga-p.hpp)});
  const rows=Object.entries(per).sort((a,b)=>b[1].o-a[1].o).map(([id,v])=>`<tr><td>${esc(mId(id)?.nama||'(dihapus)')}</td><td class="n">${nf(v.q)}</td><td class="n">${rp(v.o)}</td><td class="n">${rp(v.l)}</td></tr>`).join('');
  const bln=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return `<div class="row"><label>Tahun<select onchange="fy=+this.value;render()">${[...ys].sort().map(y=>`<option ${y===fy?'selected':''}>${y}</option>`).join('')}</select></label>
  <label>Bulan<select onchange="fm=+this.value;render()">${bln.map((b,i)=>`<option value="${i+1}" ${i+1===fm?'selected':''}>${b}</option>`).join('')}</select></label></div>
  <div class="grid">
   <div class="kpi"><small>Total Omzet</small><b>${rp(omzet)}</b></div>
   <div class="kpi"><small>Total HPP</small><b>${rp(hpp)}</b></div>
   <div class="kpi"><small>Laba Kotor (${omzet?Math.round(lk/omzet*100):0}%)</small><b class="${lk>=0?'pos':'neg'}">${rp(lk)}</b></div>
   <div class="kpi"><small>Biaya Tetap / bulan</small><b>${rp(bt)}</b></div>

   <div class="kpi"><small>Porsi Terjual</small><b>${nf(porsi)}</b></div>
   <div class="kpi"><small>Titik Impas (porsi/bulan)</small><b>${avg>0?Math.ceil(bt/avg):'–'}</b></div>

  <div class="cols"><div class="card"><h2>Omzet & Laba Kotor Harian – ${bln[fm-1]} ${fy}</h2><canvas id="c1"></canvas></div>
  <div class="card"><h2>Omzet & Laba Kotor Bulanan – ${fy}</h2><canvas id="c2"></canvas></div></div>
  <div class="card"><h2>Penjualan per Menu</h2>${tbl(['Menu','#Porsi','#Omzet','#Laba Kotor'],rows,'Belum ada penjualan di bulan ini.')}</div>`;
}
function drawCharts(){
  Object.values(charts).forEach(c=>c.destroy());charts={};
  if(typeof Chart==='undefined'){document.querySelectorAll('canvas').forEach(c=>c.outerHTML='<p class="mut">Grafik butuh Chart.js. Buka sekali dengan internet (browser menyimpannya), atau taruh file chart.umd.min.js di folder yang sama.</p>');return}
  const dim=new Date(fy,fm,0).getDate(),d1=Array(dim).fill(0),l1=Array(dim).fill(0),d2=Array(12).fill(0),l2=Array(12).fill(0);
  S.penjualan.forEach(p=>{const[y,m,d]=p.tgl.split('-').map(Number);if(y!==fy)return;const o=p.qty*p.harga,l=o-p.qty*p.hpp;d2[m-1]+=o;l2[m-1]+=l;if(m===fm){d1[d-1]+=o;l1[d-1]+=l}});
  const mk=(id,labels,o,l)=>charts[id]=new Chart(document.getElementById(id),{data:{labels,datasets:[{type:'bar',label:'Omzet',data:o,backgroundColor:'#8b6a50'},{type:'line',label:'Laba Kotor',data:l,borderColor:'#2e7d4f',backgroundColor:'#2e7d4f',tension:.3}]},options:{responsive:true,scales:{y:{ticks:{callback:v=>v>=1e6?v/1e6+' jt':v>=1e3?v/1e3+' rb':v}}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+rp(c.parsed.y)}}}}});
  mk('c1',Array.from({length:dim},(_,i)=>i+1),d1,l1);
  mk('c2',['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],d2,l2);
}

/* ---------- Bahan & Stok ---------- */
function statusB(b,st){const s=b.stokAwal+st[b.id].masuk-st[b.id].pakai;return{s,bad:s<=b.stokMin}}
function vBahan(){
  const st=stokAll();
  const rows=S.bahan.map(b=>{const x=st[b.id],{s,bad}=statusB(b,st);
    return `<tr><td>${inp('bahan',b.id,'nama',b.nama,'text','style="min-width:150px"')}</td><td>${inp('bahan',b.id,'satuanBeli',b.satuanBeli,'text','style="width:70px"')}</td>
    <td>${inp('bahan',b.id,'isi',b.isi,'number','min="0"')}</td><td>${inp('bahan',b.id,'satuanDasar',b.satuanDasar,'text','style="width:60px"')}</td>
    <td>${inp('bahan',b.id,'harga',b.harga,'number','min="0"')}</td><td>${inp('bahan',b.id,'susut',b.susut,'number','min="0" max="99" step="0.1"')}</td>
    <td class="n">${rp(hppB(b))}</td><td>${inp('bahan',b.id,'stokAwal',b.stokAwal,'number','min="0"')}</td>
    <td class="n">${nf(x.masuk)}</td><td class="n">${nf(x.pakai)}</td><td class="n"><b>${nf(s)}</b></td>
    <td>${inp('bahan',b.id,'stokMin',b.stokMin,'number','min="0"')}</td>
    <td><span class="tag ${bad?'bad':''}">${bad?'BELI LAGI':'Aman'}</span></td><td><button class="x" onclick="del('bahan','${b.id}','Hapus bahan ini beserta barisnya di resep?')">✕</button></td></tr>`}).join('');
  return `<div class="card"><h2>Daftar Bahan & Stok</h2>
  <div class="row"><label>Tanggal mulai hitung stok<input type="date" value="${S.mulai}" onchange="S.mulai=this.value;save();render()"></label>
  <button class="b" onclick="S.bahan.push({id:uid(),nama:'Bahan baru',satuanBeli:'pack',isi:1000,satuanDasar:'gram',harga:0,susut:0,stokAwal:0,stokMin:0});save();render()">+ Tambah Bahan</button></div>
  <p class="mut">Satuan dasar (gram/ml/pcs) dipakai di resep. HPP efektif = harga ÷ isi ÷ (1 − susut). Stok = stok awal + pembelian − pemakaian (transaksi pada/setelah tanggal mulai). Status "BELI LAGI" bila stok ≤ stok minimum.</p>
  ${tbl(['Nama Bahan','Sat. Beli','#Isi/Kemasan','Sat. Dasar','#Harga/Kemasan','#Susut %','#HPP Efektif/Sat','#Stok Awal','#Masuk','#Terpakai','#Stok Sekarang','#Stok Min','Status',''],rows)}</div>`;
}

  ${tbl(['Bahan','#Jumlah/Porsi','Satuan','#Biaya/Porsi',''],rr,'Resep masih kosong.')}</div>`;

/* ---------- Pembelian ---------- */

/* ---------- Backup & Restore ---------- */
function backup(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download=`backup-ruang-rindu-${today}.json`;a.click();toast('Backup diunduh');
}
function restore(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!['bahan','menu','resep','penjualan','pembelian','biaya'].every(k=>Array.isArray(d[k])))throw 0;
    if(!confirm('Semua data saat ini akan diganti dengan isi file backup. Lanjutkan?'))return;
    S=d;S.mulai=S.mulai||today;save();render();toast('Data berhasil dipulihkan')}catch(e){toast('File backup tidak valid')}};
  r.readAsText(f);inp.value='';
}
function vData(){
  return `<div class="card"><h2>Backup & Restore</h2>
  <p>Data disimpan di <b>LocalStorage</b> browser ini. Menghapus data situs/riwayat browser akan menghapusnya, jadi unduh backup secara rutin.</p>
  <div class="row"><button class="b" onclick="backup()">⬇ Backup Data (JSON)</button>
  <label>Restore dari file JSON<input type="file" accept=".json,application/json" onchange="restore(this)"></label></div></div>
  ${CLOUD?'<div class="card"><h2>Akun & Sinkron Online</h2><p>Login memakai Firebase. Data tersinkron otomatis ke semua perangkat. Untuk mengganti password, gunakan tombol "Lupa password" di layar login. Menambah atau menghapus pengguna dilakukan di Firebase Console.</p></div>':`<div class="card"><h2>Ganti Username & Password</h2><form id="fp" class="row" onsubmit="chgPw();return false">
  <label>Username lama<input name="ou" type="text" autocomplete="off"></label><label>Password lama<input name="op" type="password" autocomplete="off"></label>
  <label>Username baru<input name="nu" type="text" autocomplete="off"></label><label>Password baru<input name="np" type="password" autocomplete="new-password"></label>
  <button class="b" type="submit">Ganti</button></form>
  <p class="mut">Berlaku di browser/perangkat ini saja. Login ini hanya pembatas tampilan, bukan pengamanan data yang kuat.</p></div>`}
  <div class="card"><h2>Mulai Bersih</h2><p class="mut">Data awal berisi contoh dari file Excel. Hapus transaksi contoh sebelum memakai data asli (bahan, resep, dan menu tetap).</p>
  <div class="row"><button class="b r" onclick="if(confirm('Hapus semua penjualan & pembelian?')){S.penjualan=[];S.pembelian=[];save();render();toast('Transaksi dihapus')}">Hapus Semua Transaksi</button>
  <button class="b r" onclick="if(confirm('Kembalikan ke data contoh awal? Semua perubahan hilang.')){S=JSON.parse(JSON.stringify(SEED));save();render()}">Reset ke Data Contoh</button></div></div>`;
}

/* ---------- Login ---------- */
const AUTH={"salt": "4ba70c69ab6ffebdcf947b873a51763a", "it": 200000, "hash": "58a76a9d58e21527d70f8c425762016079f0a94c15161ce52dc44e502682ff03"};
const getAuth=()=>{try{return JSON.parse(localStorage.getItem('rr_auth'))||AUTH}catch(e){return AUTH}};
async function hashCred(u,p,salt,it){const e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(u.trim().toLowerCase()+'\0'+p),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:e.encode(salt),iterations:it},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let fails=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const authMsg=c=>c==='auth/too-many-requests'?'Terlalu banyak percobaan, coba lagi nanti.':c==='auth/network-request-failed'?'Tidak ada koneksi internet.':'Email atau password salah.';
async function doLogin(){
  const f=document.getElementById('fl'),er=document.getElementById('lerr');er.textContent='';
  if(CLOUD){
    try{await auth.signInWithEmailAndPassword(f.u.value.trim(),f.p.value);f.p.value=''}
    catch(e){fails++;er.textContent=authMsg(e.code);await sleep(Math.min(fails,5)*700)}
    return}
  if(!window.crypto||!crypto.subtle){er.textContent='Browser tidak mendukung login aman. Buka lewat https (GitHub Pages).';return}
  const a=getAuth(),h=await hashCred(f.u.value,f.p.value,a.salt,a.it);
  if(h===a.hash){fails=0;sessionStorage.setItem('rr_in','1');f.p.value='';showApp()}
  else{fails++;er.textContent='Username atau password salah.';await sleep(Math.min(fails,5)*700)}
}
async function resetPw(){
  const f=document.getElementById('fl'),er=document.getElementById('lerr');
  if(!f.u.value.trim()){er.textContent='Isi email dulu, lalu klik lagi.';return}
  try{await auth.sendPasswordResetEmail(f.u.value.trim());er.style.color='var(--ok)';er.textContent='Email reset password dikirim (cek juga folder spam).'}
  catch(e){er.style.color='var(--bad)';er.textContent=authMsg(e.code)}
}
function logout(){if(CLOUD){auth.signOut()}else{sessionStorage.removeItem('rr_in');location.reload()}}
function showApp(){document.getElementById('login').style.display='none';render()}
async function chgPw(){
  const f=document.getElementById('fp'),a=getAuth();
  if(!window.crypto||!crypto.subtle)return toast('Browser tidak mendukung');
  if(f.nu.value.trim().length<3||f.np.value.length<8)return toast('Username min. 3 huruf, password min. 8 karakter');
  if(await hashCred(f.ou.value,f.op.value,a.salt,a.it)!==a.hash)return toast('Password lama salah');
  const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');
  localStorage.setItem('rr_auth',JSON.stringify({salt,it:a.it,hash:await hashCred(f.nu.value,f.np.value,salt,a.it)}));
  f.reset();toast('Username & password diganti (berlaku di browser ini)');
}

/* ---------- Sinkron online (Firebase) ---------- */
let db,auth,ready=false,txStarted=false,unsub=[],last={},known={penjualan:{},pembelian:{}},me='';
const P='usaha/ruangrindu',MASTER=['bahan','menu','resep','biaya','mulai'],TX=['penjualan','pembelian'];
const setInfo=t=>{document.getElementById('saveinfo').textContent=t};
const okInfo=()=>setInfo(navigator.onLine?'☁ Tersinkron · '+me:'Offline – perubahan dikirim saat online');
const fail=e=>setInfo('⚠ Sinkron gagal: '+(e.code||e.message));
function softRender(){const a=document.activeElement;if(a&&a.tagName==='INPUT'&&a.closest&&a.closest('#app'))return setTimeout(softRender,1500);render()}
function cloudInit(){
  firebase.initializeApp(FB_CONFIG);auth=firebase.auth();db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  addEventListener('online',okInfo);addEventListener('offline',okInfo);
  auth.onAuthStateChanged(u=>{
    if(u){document.getElementById('login').style.display='none';me=u.email;startSync()}
    else{stopSync();document.getElementById('app').innerHTML='';document.getElementById('login').style.display='flex'}});
}
function stopSync(){unsub.forEach(f=>f());unsub=[];ready=false;txStarted=false;last={};known={penjualan:{},pembelian:{}}}
function startSync(){
  stopSync();setInfo('☁ Menyambung… '+me);render();
  unsub.push(db.collection(P+'/master').onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(snap.empty){if(snap.metadata.fromCache)return;initCloud();startTx();okInfo();return}
    snap.docs.forEach(d=>{if(MASTER.includes(d.id)){last[d.id]=d.data().v;S[d.id]=JSON.parse(d.data().v)}});
    localSave();startTx();softRender();okInfo();
  },fail));
}
function initCloud(){
  MASTER.forEach(k=>{last[k]=JSON.stringify(S[k]);db.doc(P+'/master/'+k).set({v:last[k]}).catch(fail)});
  TX.forEach(k=>S[k].forEach(x=>{known[k][x.id]=JSON.stringify(x);db.doc(P+'/'+k+'/'+x.id).set(x).catch(fail)}));
}
function startTx(){
  if(txStarted)return;txStarted=true;ready=true;
  TX.forEach(k=>unsub.push(db.collection(P+'/'+k).onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const arr=snap.docs.map(d=>d.data());S[k]=arr;known[k]={};arr.forEach(x=>known[k][x.id]=JSON.stringify(x));
    localSave();softRender();okInfo();
  },fail)));
}
function push(){
  if(!ready)return;
  MASTER.forEach(k=>{const j=JSON.stringify(S[k]);if(j!==last[k]){last[k]=j;db.doc(P+'/master/'+k).set({v:j}).catch(fail)}});
  TX.forEach(k=>{const cur={};S[k].forEach(x=>cur[x.id]=x);
    for(const id in cur){const j=JSON.stringify(cur[id]);if(known[k][id]!==j){known[k][id]=j;db.doc(P+'/'+k+'/'+id).set(cur[id]).catch(fail)}}
    for(const id in known[k])if(!cur[id]){delete known[k][id];db.doc(P+'/'+k+'/'+id).delete().catch(fail)}});
}

function boot(){
  document.getElementById('llogo').src=document.querySelector('.logo').src;
  if(CLOUD){
    const f=document.getElementById('fl'),er=document.getElementById('lerr');
    f.u.type='email';f.u.parentNode.firstChild.textContent='Email';document.getElementById('lreset').style.display='block';
    if(typeof firebase==='undefined'){document.getElementById('login').style.display='flex';er.textContent='Butuh internet untuk memuat layanan sinkron. Coba muat ulang.';return}
    cloudInit();return}
  if(sessionStorage.getItem('rr_in')==='1')showApp();else document.getElementById('login').style.display='flex';
}
boot();
</script>
